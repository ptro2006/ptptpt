<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="jouw naam" />
    <meta name="color-scheme" content="dark light" />

    <title>Digital garden van Row</title>
    <link rel="stylesheet" href="./css/normal.css" />

    <!-- Voeg jouw eigen domein toe in data-page -->
    <script>
      data - page;
      ("https://example.com");
      src = "./scripts/main.js";
      defer;
    </script>
  </head>

  <body>
    <header>
      <h1>Muziek</h1>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="https://github.com/account/repo">Learning Log</a></li>
        </ul>
      </nav>

      <form>
        <label for="light-mode">
          <input
            type="radio"
            id="light-mode"
            name="color-theme"
            value="light"
          />
          Licht
        </label>
        <label for="dark-mode">
          <input type="radio" id="dark-mode" name="color-theme" value="dark" />
          Donker
        </label>
      </form>

      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
        href="https://fonts.googleapis.com/css2?family=Blaka+Hollow&family=Jacquard+24+Charted&family=MedievalSharp&display=swap"
        rel="stylesheet"
      />
    </header>

    <main>
      <article>
        <img
          src="/images/tutuwawa.jpeg"
          alt="xlov's i=! album, niet de officiële cover, maar de 'i' versie van het album"
        />
        <section>
          <h2>Tooth Gem Chiwawa - XLOV</h2>
          <p>Have you ever felt nostalgia?</p>
        </section>
      </article>

      <article>
        <img
          src="/images/junhee_umbrella.jpeg"
          alt="Album cover van Junhee's 'The first day & night' album"
        />
        <section>
          <h2>Umbrella (10:00) - Junhee</h2>
          <p>You always said we'd be together, forever, whatever the weather</p>
        </section>
      </article>

      <article>
        <img
          src="/images/epikhighstrawberry.png"
          alt="Album cover van Epik High's 'Strawberry'"
        />
        <section>
          <h2>Catch - Epik High, Hwasa</h2>
          <p>
            Call me when ur feeling down. Before you hit the ground. I'll be
            there to catch you.
          </p>
        </section>
      </article>
    </main>

    <footer></footer>
  </body>
</html>
